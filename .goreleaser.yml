version: 2
project_name: Audimance
builds:
   - binary: audimance
     env:
        - CGO_ENABLED=0
     goos:
        - windows
        - darwin
        - linux
     goarch:
        - amd64
        - arm64
        - arm
   - binary: autotrigger
     id: autotrigger
     main: ./cmd/autotrigger
     env:
        - CGO_ENABLED=0
     goos:
        - windows
        - darwin
        - linux
     goarch:
        - amd64
        - arm64
        - arm
   - binary: redirector
     id: redirector
     main: ./cmd/redirector
     env:
        - CGO_ENABLED=0
     goos:
        - windows
        - darwin
        - linux
     goarch:
        - amd64
        - arm64
        - arm

archives:
  - id: audimance
    formats: [ 'binary' ]
    name_template: "{{ .Binary }}.{{ .Os }}.{{ .Arch }}"
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
       - '^docs:'
       - '^test:'

dockers_v2:
  - images:
      - cycoresystems/audimance
      - ghcr.io/cycoresystems/audimance
    tags:
      - "{{ .Tag }}"
      - "{{ .Major }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "latest"
    dockerfile: Dockerfile.goreleaser
